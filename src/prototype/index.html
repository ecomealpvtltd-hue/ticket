<title>Ecomeal Support Prototype</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: a fixed prototype bar on top; below it either the customer's app (with the widget) or the team dashboard. */
  :root {
    --bar: #0b1510; --bar-fg: #e9f1e8; --bar-muted: rgba(233, 241, 232, .62); --bar-line: rgba(233, 241, 232, .12);
    --lime: #c7f04a; --on-lime: #0a1410;
    --bg: #f3f4f1; --panel: #ffffff; --fg: #17201b; --muted: #5d665f; --line: #e1e4de;
    --ok: #1f7a4a; --warn: #a55f00; --bad: #b7352c;
    --sans: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --bar-h: 56px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #101412; --panel: #171c19; --fg: #e6ece7; --muted: #9aa59d; --line: #28302b; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #101412; --panel: #171c19; --fg: #e6ece7; --muted: #9aa59d; --line: #28302b; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

  .bar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); color: var(--bar-fg);
    display: flex; align-items: center; gap: 16px; min-height: var(--bar-h); padding: 8px 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; }
  .mark { width: 26px; height: 26px; border-radius: 7px; background: var(--lime); color: var(--on-lime); display: grid; place-items: center; font-weight: 600; }
  .proto { font-weight: 500; color: var(--bar-muted); }
  .switch { display: flex; gap: 4px; padding: 3px; border: 1px solid var(--bar-line); border-radius: 10px; margin-left: auto; }
  .switch button { height: 34px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; color: var(--bar-muted); font: 500 14px var(--sans); cursor: pointer; }
  .switch button:hover { color: var(--bar-fg); }
  .switch button[aria-selected="true"] { background: var(--lime); color: var(--on-lime); }
  .reset { height: 34px; padding: 0 12px; border: 1px solid var(--bar-line); border-radius: 8px; background: transparent; color: var(--bar-muted); font: 500 13px var(--sans); cursor: pointer; }
  .reset:hover { color: var(--bar-fg); }
  .confirm { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--bar-muted); }
  .confirm button { height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--bar-line); background: transparent; color: var(--bar-fg); font: 500 13px var(--sans); cursor: pointer; }
  .confirm .yes { background: var(--bar-fg); color: var(--bar); border-color: var(--bar-fg); }
  .note { margin: 0; background: var(--panel); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; padding: 8px 16px; }
  .note b { color: var(--fg); font-weight: 600; }

  /* Customer's website: deliberately empty. Only the support button and panel are the product. */
  .site { min-height: calc(100vh - var(--bar-h) - 38px); min-height: calc(100dvh - var(--bar-h) - 38px); display: grid; place-items: center; padding: 32px 16px 120px; }
  .site p { margin: 0; max-width: 34em; text-align: center; color: var(--muted); font-size: 14px; }
  .site b { color: var(--fg); font-weight: 600; }
  .dash { height: calc(100vh - var(--bar-h) - 38px); height: calc(100dvh - var(--bar-h) - 38px); }
  .dash iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }

  @media (max-width: 760px) {
    .switch { margin-left: 0; order: 3; width: 100%; }
    .switch button { flex: 1; padding: 0 8px; }
    .proto { display: none; }
    .dash { height: calc(100dvh - 140px); }
  }
</style>

<header class="bar">
  <div class="brand"><span class="mark" aria-hidden="true">e</span>Ecomeal Support <span class="proto">Prototype</span></div>
  <div class="switch" role="tablist" aria-label="Choose a view">
    <button role="tab" data-view="site" aria-selected="true" id="tab-site">Customer view</button>
    <button role="tab" data-view="dash" aria-selected="false" id="tab-dash">Support team dashboard</button>
  </div>
  <button class="reset" id="reset" type="button">Reset</button>
  <div class="confirm" id="reset-confirm" hidden>Clear tickets you created here?
    <button class="yes" id="reset-yes" type="button">Clear</button><button id="reset-no" type="button">Cancel</button>
  </div>
</header>
<p class="note">Prototype. Tickets you raise are saved in this browser only; three example tickets are included.</p>

<main id="view-site">
  <div class="site">
    <p>This blank area stands in for your own website or app. Customers only see the <b>Support</b> button in the corner and the panel it opens.</p>
  </div>
</main>

<main id="view-dash" class="dash" hidden>
  <iframe id="dash-frame" title="Support team dashboard"></iframe>
</main>

<script type="module" src="./shell-entry.ts"></script>
